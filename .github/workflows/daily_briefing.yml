name: 🧠 每日科技投资简报

on:
  schedule:
    - cron: '0 1 * * *'    # 北京时间 09:00（UTC 01:00）早班
    - cron: '30 7 * * *'   # 北京时间 15:30（UTC 07:30）午班
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: write

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: pip install openai requests

      - name: 🧠 生成简报 + 推送
        env:
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          WXPUSHER_APP_TOKEN:    ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS:         ${{ secrets.WXPUSHER_UIDS }}
          SERVERCHAN_KEY:        ${{ secrets.SERVERCHAN_KEY }}
        run: python generate_report.py

      - name: 📤 提交报告
        run: |
          git config --global user.name  "IntelBriefBot"
          git config --global user.email "bot@intel-briefing.ai"
          git add reports/ README.md docs/ 2>/dev/null || git add reports/ README.md
          git diff --staged --quiet || \
            git commit -m "🧠 简报 $(date +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git push
