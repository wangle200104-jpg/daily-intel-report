name: 🧠 每日科技投资深度简报

on:
  schedule:
    - cron: '0 1 * * *'       # 北京时间 09:00（UTC 01:00）
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: pip install openai requests

      - name: 🧠 生成简报 + 推送
        env:
          # ── DeepSeek（必填）──────────────────────
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          # ── 微信 WxPusher（选填）────────────────
          WXPUSHER_APP_TOKEN:    ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS:         ${{ secrets.WXPUSHER_UIDS }}
          # ── QQ Qmsg酱（选填）────────────────────
          QMSG_KEY:              ${{ secrets.QMSG_KEY }}
          QMSG_QQ:               ${{ secrets.QMSG_QQ }}
          # ── Server酱备用（选填）─────────────────
          SERVERCHAN_KEY:        ${{ secrets.SERVERCHAN_KEY }}
        run: python generate_report.py

      - name: 📤 提交报告到仓库
        run: |
          git config --global user.name  "IntelBriefBot"
          git config --global user.email "bot@intel-briefing.ai"
          git add reports/ README.md
          git diff --staged --quiet || \
            git commit -m "🧠 简报 $(date +'%Y-%m-%d') · 10深度+20快讯 [skip ci]"
          git push